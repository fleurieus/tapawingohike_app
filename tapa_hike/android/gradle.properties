org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Workaround for a Kotlin bug on Windows when the Pub cache and the project
# live on different drives (e.g. C:\Users\<...>\AppData\Local\Pub\Cache vs
# D:\projects\...): RelocatableFileToPathConverter throws
#   IllegalArgumentException: this and base files have different roots
# which kills the Kotlin daemon mid-compile and surfaces as misleading
# "Unresolved reference" errors. Disabling incremental compilation skips
# that converter entirely. CI is unaffected (fresh builds anyway).
kotlin.incremental=false
